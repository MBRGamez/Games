<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧟 Зомбанадольск</title>
    <style>
        * { margin: 0; padding: 0; user-select: none; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game {
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255,0,0,0.2);
            position: relative;
        }
        canvas {
            border-radius: 12px;
            cursor: crosshair;
            display: block;
            background: #1a1a2e;
            touch-action: none;
        }
        #ui {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            color: white;
        }
        #ui > div {
            background: rgba(0,0,0,0.6);
            padding: 6px 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #ui .value {
            font-size: 22px;
            font-weight: bold;
            color: #ff6b6b;
        }
        #ui .label { font-size: 11px; color: #888; }
        #shop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #ff6b6b;
            display: none;
            color: white;
            text-align: center;
            min-width: 300px;
            z-index: 10;
        }
        #shop h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #shop p {
            font-size: 18px;
            margin: 10px 0;
            color: #aaa;
        }
        .shop-btn {
            background: #ff6b6b;
            border: none;
            color: white;
            font-size: 20px;
            padding: 12px 30px;
            border-radius: 30px;
            margin: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .shop-btn:hover { transform: scale(1.05); background: #ff5252; }
        .shop-btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        #waveInfo {
            color: #ffd93d;
            font-size: 20px;
            margin: 5px 0;
        }
        #gameTitle {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        .weapon-indicator {
            color: #4ecdc4 !important;
        }
        .boss-indicator {
            color: #ff6b6b !important;
            animation: glow 0.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #ff6b6b; }
            to { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff0000; }
        }
    </style>
</head>
<body>
<div id="game">
    <div id="gameTitle">🧟 ЗОМБАНАДОЛЬСК 🧟</div>
    <canvas id="canvas" width="800" height="500"></canvas>
    
    <div id="ui">
        <div>🎯 <span class="label">Очки</span><div class="value" id="score">0</div></div>
        <div>⏱ <span class="label">Время</span><div class="value" id="timer">15</div></div>
        <div>🧟 <span class="label">Зомби</span><div class="value" id="zombieCount">0</div></div>
        <div>🔫 <span class="label">Патроны</span><div class="value" id="ammo">100</div></div>
        <div>💰 <span class="label">Монеты</span><div class="value" id="coins">0</div></div>
        <div>⚡ <span class="label">Волна</span><div class="value" id="wave">1</div></div>
        <div>🔫 <span class="label">Оружие</span><div class="value weapon-indicator" id="weapon">1</div></div>
        <div>💀 <span class="label">Босс</span><div class="value" id="bossIndicator">-</div></div>
    </div>

    <div id="shop">
        <h2>🧟‍♂️ ЗОМБАНАДОЛЬСК</h2>
        <div id="waveInfo">Волна 1 завершена!</div>
        <p>Заработано: <span id="earnedCoins">0</span> монет</p>
        <p>💀 Убито зомби: <span id="killedCount">0</span></p>
        <hr style="margin: 15px 0; border-color: #333;">
        <div>
            <button class="shop-btn" id="buyAmmo">🔫 Патроны (30шт) — 50 монет</button>
        </div>
        <div style="margin-top: 10px;">
            <button class="shop-btn" id="startWave" style="background: #4ecdc4;">⚡ НАЧАТЬ ВОЛНУ</button>
        </div>
    </div>
</div>

<script src="https://sdk.yandexgames.ru/v1.0/sdk.js"></script>
<script>
    // ======================================================================
    //  🧟 ЗОМБАНАДОЛЬСК — ULTIMATE EDITION
    // ======================================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 500;

    // UI
    const scoreSpan = document.getElementById('score');
    const timerSpan = document.getElementById('timer');
    const zombieSpan = document.getElementById('zombieCount');
    const ammoSpan = document.getElementById('ammo');
    const coinsSpan = document.getElementById('coins');
    const waveSpan = document.getElementById('wave');
    const weaponSpan = document.getElementById('weapon');
    const bossIndicator = document.getElementById('bossIndicator');
    const shopDiv = document.getElementById('shop');
    const earnedCoinsSpan = document.getElementById('earnedCoins');
    const killedCountSpan = document.getElementById('killedCount');
    const buyAmmoBtn = document.getElementById('buyAmmo');
    const startWaveBtn = document.getElementById('startWave');

    // ======================================================================
    //  🔥 НОВАЯ АУДИОСИСТЕМА (не пропадает звук!)
    // ======================================================================
    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
    }

    function playSound(freq, duration, type = 'square', volume = 0.12) {
        try {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = volume;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch(e) { /* тихо */ }
    }

    function zombieGrowl() {
        try {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(70 + Math.random() * 30, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30 + Math.random() * 20, ctx.currentTime + 0.5);
            gain.gain.value = 0.06 + Math.random() * 0.04;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch(e) { /* тихо */ }
    }

    function playShoot() { playSound(800, 0.08, 'sawtooth', 0.07); }
    function playHit() { playSound(300, 0.12, 'square', 0.08); }
    function playZombieDie() { playSound(180, 0.3, 'sawtooth', 0.1); }
    function playWaveComplete() { playSound(523, 0.15, 'square', 0.08); }
    function playBuy() { playSound(600, 0.12, 'square', 0.08); }
    function playGameOver() { playSound(120, 0.6, 'sawtooth', 0.1); }
    function playBossAppear() {
        for (let i = 0; i < 3; i++) {
            setTimeout(() => playSound(150 + i * 100, 0.3, 'sawtooth', 0.12), i * 200);
        }
    }
    function playBossDie() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => playSound(300 - i * 50, 0.2, 'square', 0.1), i * 150);
        }
    }

    // ======================================================================
    //  СОСТОЯНИЕ ИГРЫ
    // ======================================================================
    let game = {
        score: 0,
        coins: 0,
        ammo: 100,
        wave: 0,
        timeLeft: 15,
        zombies: [],
        particles: [],
        bullets: [],
        kills: 0,
        isActive: false,
        isShopOpen: false,
        timerInterval: null,
        spawnInterval: null,
        maxZombies: 8,
        spawnRate: 50,
        mouseX: W/2,
        mouseY: H/2,
        weaponLevel: 1, // количество стволов
        bossSpawned: false,
        bossDefeated: false,
        bossCount: 0,
        hitFlash: 0,
    };

    // ======================================================================
    //  ЯНДЕКС SDK
    // ======================================================================
    let sdk = null;
    async function initSDK() {
        try {
            sdk = await YaGames.init();
            const data = await sdk.player.getData(['record']);
            if (data && data.record) console.log('🏆 Рекорд:', data.record);
        } catch(e) { console.warn('SDK офлайн'); }
    }
    initSDK();

    // ======================================================================
    //  КЛАСС ЗОМБИ (🐌 ОЧЕНЬ МЕДЛЕННЫЙ!)
    // ======================================================================
    class Zombie {
        constructor(isBoss = false) {
            this.isBoss = isBoss;
            
            if (isBoss) {
                this.size = 60 + Math.random() * 20;
                this.hp = 20 + game.wave * 3;
                this.speed = 0.15 + game.wave * 0.015;
                this.color = '#8B0000';
                this.eyeColor = '#ff0000';
                this.reward = 50 + game.wave * 10;
                this.coinReward = 30 + game.wave * 5;
                this.skinColor = '#4a1a1a';
                this.clothesColor = '#2a0a0a';
                playBossAppear();
            } else {
                this.size = 20 + Math.random() * 18;
                this.hp = 1 + Math.floor(game.wave / 4);
                // 🔥 СКОРОСТЬ ЕЩЁ МЕНЬШЕ!
                this.speed = 0.15 + Math.random() * 0.25 + game.wave * 0.02;
                this.color = `hsl(${100 + Math.random() * 40}, 60%, ${30 + Math.random() * 25}%)`;
                this.eyeColor = Math.random() > 0.5 ? '#ff0000' : '#ff4400';
                this.reward = 10 + game.wave * 2;
                this.coinReward = 6 + game.wave * 1.5;
                this.skinColor = `hsl(${100 + Math.random() * 40}, 60%, ${30 + Math.random() * 25}%)`;
                this.clothesColor = `hsl(${200 + Math.random() * 30}, 30%, ${20 + Math.random() * 20}%)`;
            }
            
            this.maxHp = this.hp;
            this.damage = isBoss ? 5 : 1;
            this.hitFlash = 0;
            this.walkOffset = 0;
            this.walkSpeed = 0.02 + Math.random() * 0.02;
            
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { this.x = -this.size; this.y = Math.random() * H; }
            else if (side === 1) { this.x = W + this.size; this.y = Math.random() * H; }
            else if (side === 2) { this.x = Math.random() * W; this.y = -this.size; }
            else { this.x = Math.random() * W; this.y = H + this.size; }
            
            if (!isBoss) zombieGrowl();
        }

        update() {
            const dx = W/2 - this.x;
            const dy = H/2 - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
            this.walkOffset += this.walkSpeed;
            if (this.hitFlash > 0) this.hitFlash--;
        }

        draw() {
            const s = this.size;
            const wobble = Math.sin(this.walkOffset) * (this.isBoss ? 2 : 1.2);
            
            ctx.save();
            ctx.translate(this.x, this.y + wobble);
            
            // Тень (босс — больше)
            ctx.shadowColor = this.isBoss ? 'rgba(255,0,0,0.5)' : 'rgba(255,0,0,0.2)';
            ctx.shadowBlur = this.isBoss ? 40 : 15;
            
            const color = this.hitFlash > 0 ? '#ffffff' : this.skinColor;
            ctx.fillStyle = color;
            ctx.shadowBlur = 0;
            
            // Тело
            const scale = this.isBoss ? 1.3 : 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.7 * scale, s * 0.7 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.isBoss ? 'rgba(255,0,0,0.5)' : 'rgba(0,0,0,0.3)';
            ctx.lineWidth = this.isBoss ? 3 : 1.5;
            ctx.stroke();
            
            // Одежда
            ctx.fillStyle = this.clothesColor;
            ctx.beginPath();
            ctx.ellipse(0, s * 0.15 * scale, s * 0.6 * scale, s * 0.5 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Руки
            ctx.strokeStyle = this.skinColor;
            ctx.lineWidth = s * 0.25 * scale;
            ctx.lineCap = 'round';
            for (let side = -1; side <= 1; side += 2) {
                ctx.beginPath();
                ctx.moveTo(side * s * 0.5 * scale, s * 0.1 * scale);
                const armX = side * s * 0.9 * scale + Math.sin(this.walkOffset + side) * (this.isBoss ? 6 : 3);
                const armY = s * 0.2 * scale + Math.sin(this.walkOffset * 0.5 + side) * (this.isBoss ? 10 : 5);
                ctx.lineTo(armX, armY);
                ctx.stroke();
            }
            
            // Ноги
            ctx.strokeStyle = this.isBoss ? '#1a0a0a' : '#2d2d2d';
            ctx.lineWidth = s * 0.2 * scale;
            for (let side = -1; side <= 1; side += 2) {
                const legOffset = Math.sin(this.walkOffset * 0.8 + side) * (this.isBoss ? 8 : 4);
                ctx.beginPath();
                ctx.moveTo(side * s * 0.2 * scale, s * 0.4 * scale);
                ctx.lineTo(side * s * 0.4 * scale + legOffset * 0.3, s * 0.7 * scale);
                ctx.stroke();
            }
            
            // Голова
            ctx.fillStyle = color;
            ctx.shadowBlur = this.isBoss ? 20 : 8;
            ctx.shadowColor = this.isBoss ? 'rgba(255,0,0,0.3)' : 'rgba(255,0,0,0.1)';
            ctx.beginPath();
            ctx.arc(0, -s * 0.25 * scale, s * 0.4 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.isBoss ? 'rgba(255,0,0,0.3)' : 'rgba(0,0,0,0.2)';
            ctx.lineWidth = this.isBoss ? 2 : 1;
            ctx.stroke();
            
            // Глаза (босс — больше и ярче)
            ctx.shadowBlur = this.isBoss ? 25 : 12;
            ctx.shadowColor = this.eyeColor;
            ctx.fillStyle = '#f0f0f0';
            ctx.shadowBlur = 0;
            const eyeSize = this.isBoss ? 1.5 : 1;
            for (let side = -1; side <= 1; side += 2) {
                ctx.beginPath();
                ctx.ellipse(side * s * 0.15 * scale * eyeSize, -s * 0.3 * scale, s * 0.12 * scale * eyeSize, s * 0.08 * scale * eyeSize, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = this.eyeColor;
            ctx.shadowBlur = this.isBoss ? 30 : 15;
            ctx.shadowColor = this.eyeColor;
            for (let side = -1; side <= 1; side += 2) {
                ctx.beginPath();
                ctx.arc(side * s * 0.18 * scale * eyeSize, -s * 0.28 * scale, s * 0.05 * scale * eyeSize, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Рот (босс — больше)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = this.isBoss ? '#8B0000' : '#2d2d2d';
            ctx.lineWidth = this.isBoss ? 3 : 1.5;
            const mouthSize = this.isBoss ? 1.4 : 1;
            ctx.beginPath();
            ctx.arc(0, -s * 0.18 * scale, s * 0.12 * scale * mouthSize, 0.1, Math.PI - 0.1);
            ctx.stroke();
            ctx.fillStyle = this.isBoss ? '#8B0000' : '#ddd';
            const teethCount = this.isBoss ? 6 : 4;
            for (let i = -teethCount/2; i <= teethCount/2; i++) {
                ctx.fillRect(i * s * 0.04 * scale - 1, -s * 0.15 * scale, this.isBoss ? 4 : 2, this.isBoss ? 6 : 3);
            }
            
            // 👑 Корона для босса
            if (this.isBoss) {
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffd700';
                ctx.beginPath();
                ctx.moveTo(-s*0.3, -s*0.6);
                ctx.lineTo(-s*0.4, -s*0.85);
                ctx.lineTo(-s*0.2, -s*0.75);
                ctx.lineTo(0, -s*0.9);
                ctx.lineTo(s*0.2, -s*0.75);
                ctx.lineTo(s*0.4, -s*0.85);
                ctx.lineTo(s*0.3, -s*0.6);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#daa520';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            
            // Полоска HP
            ctx.shadowBlur = 0;
            const hpW = s * 0.8 * scale;
            const hpY = this.isBoss ? -s * 0.75 * scale : -s * 0.7 * scale;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(-hpW/2, hpY, hpW, this.isBoss ? 8 : 4);
            const hpRatio = this.hp / this.maxHp;
            ctx.fillStyle = hpRatio > 0.5 ? '#4ecdc4' : (hpRatio > 0.25 ? '#ffd93d' : '#ff6b6b');
            ctx.fillRect(-hpW/2, hpY, hpW * hpRatio, this.isBoss ? 8 : 4);
            
            // Надпись BOSS
            if (this.isBoss) {
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0000';
                ctx.fillText('💀 BOSS', 0, -s - 15);
                ctx.shadowBlur = 0;
            }
            
            ctx.restore();
        }

        takeDamage(dmg) {
            this.hp -= dmg;
            this.hitFlash = 8;
            if (this.hp <= 0) return true;
            return false;
        }
    }

    // ======================================================================
    //  КЛАСС ПУЛИ (поддержка нескольких стволов)
    // ======================================================================
    class Bullet {
        constructor(x, y, angle, spread = 0) {
            this.x = x;
            this.y = y;
            const finalAngle = angle + (spread || 0);
            this.speed = 12;
            this.vx = Math.cos(finalAngle) * this.speed;
            this.vy = Math.sin(finalAngle) * this.speed;
            this.life = 60;
            this.trail = [];
        }

        update() {
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 8) this.trail.shift();
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
            return this.life > 0 && this.x > -50 && this.x < W+50 && this.y > -50 && this.y < H+50;
        }

        draw() {
            for (let i = 0; i < this.trail.length; i++) {
                const alpha = i / this.trail.length * 0.5;
                ctx.fillStyle = `rgba(255, 255, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.trail[i].x, this.trail[i].y, 3 * (i/this.trail.length), 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // ======================================================================
    //  ЧАСТИЦЫ
    // ======================================================================
    class Particle {
        constructor(x, y, color, count = 15, speed = 4, isBoss = false) {
            this.parts = [];
            const cnt = isBoss ? count * 2 : count;
            const spd = isBoss ? speed * 1.5 : speed;
            for (let i = 0; i < cnt; i++) {
                const angle = Math.random() * Math.PI * 2;
                const sp = Math.random() * spd + 1;
                this.parts.push({
                    x, y,
                    vx: Math.cos(angle) * sp,
                    vy: Math.sin(angle) * sp,
                    life: (isBoss ? 60 : 30) + Math.random() * (isBoss ? 40 : 30),
                    maxLife: (isBoss ? 60 : 30) + Math.random() * (isBoss ? 40 : 30),
                    size: (isBoss ? 4 : 3) + Math.random() * (isBoss ? 8 : 6),
                    color: color || `hsl(${Math.random() * 40 + 350}, 80%, ${30 + Math.random() * 40}%)`
                });
            }
            this.alive = true;
        }

        update() {
            let anyAlive = false;
            for (const p of this.parts) {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.vy += 0.05;
                p.life--;
                if (p.life > 0) anyAlive = true;
            }
            if (!anyAlive) this.alive = false;
        }

        draw() {
            for (const p of this.parts) {
                if (p.life <= 0) continue;
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
    }

    // ======================================================================
    //  ИГРОВЫЕ ФУНКЦИИ
    // ======================================================================

    function getWeaponLevel() {
        return Math.min(game.wave, 8); // максимум 8 стволов
    }

    function shoot() {
        if (!game.isActive) return;
        if (game.ammo <= 0) {
            playGameOver();
            return;
        }
        
        game.ammo--;
        updateUI();
        playShoot();
        
        const angle = Math.atan2(game.mouseY - H/2, game.mouseX - W/2);
        const barrels = getWeaponLevel();
        
        // 🔫 МНОГОСТВОЛЬНОЕ ОРУЖИЕ
        if (barrels === 1) {
            // Один ствол — точный выстрел
            const bullet = new Bullet(W/2, H/2, angle);
            game.bullets.push(bullet);
        } else {
            // Веер из пуль
            const spread = 0.2; // разброс
            const startAngle = angle - (barrels - 1) * spread / 2;
            for (let i = 0; i < barrels; i++) {
                const a = startAngle + i * spread;
                const bullet = new Bullet(W/2, H/2, a, 0);
                game.bullets.push(bullet);
            }
        }
        
        // Эффект выстрела
        for (let i = 0; i < 3 + barrels; i++) {
            const p = new Particle(W/2, H/2, '#ffaa00', 2, 1);
            game.particles.push(p);
        }
    }

    function hitZombie(bullet) {
        for (let i = game.zombies.length - 1; i >= 0; i--) {
            const z = game.zombies[i];
            const dx = bullet.x - z.x;
            const dy = bullet.y - z.y;
            const hitRadius = z.isBoss ? z.size * 1.1 : z.size;
            if (dx*dx + dy*dy < hitRadius * hitRadius) {
                playHit();
                const killed = z.takeDamage(z.isBoss ? 2 : 1);
                
                const blood = new Particle(z.x, z.y, null, z.isBoss ? 20 : 12, z.isBoss ? 6 : 5, z.isBoss);
                game.particles.push(blood);
                
                if (killed) {
                    if (z.isBoss) {
                        playBossDie();
                        game.score += z.reward;
                        game.coins += z.coinReward;
                        game.bossDefeated = true;
                        game.bossSpawned = false;
                        bossIndicator.textContent = '💀 ПОБЕЖДЁН!';
                        bossIndicator.className = 'value';
                        // Огромный взрыв
                        const explosion = new Particle(z.x, z.y, '#ff4444', 50, 10, true);
                        game.particles.push(explosion);
                        // Дополнительные бонусы за босса
                        game.ammo += 20;
                    } else {
                        playZombieDie();
                        game.score += z.reward;
                        game.coins += z.coinReward;
                        const explosion = new Particle(z.x, z.y, '#ff4444', 20, 6);
                        game.particles.push(explosion);
                    }
                    game.zombies.splice(i, 1);
                    game.kills++;
                    updateUI();
                }
                return true;
            }
        }
        return false;
    }

    function spawnBoss() {
        if (game.bossSpawned) return;
        game.bossSpawned = true;
        game.bossDefeated = false;
        const boss = new Zombie(true);
        game.zombies.push(boss);
        bossIndicator.textContent = '👑 БОСС!';
        bossIndicator.className = 'value boss-indicator';
    }

    function spawnZombie() {
        if (game.zombies.length >= game.maxZombies) return;
        // Проверяем, не пора ли босса
        if (game.wave % 5 === 0 && !game.bossSpawned && game.zombies.length < game.maxZombies - 1) {
            spawnBoss();
            return;
        }
        game.zombies.push(new Zombie(false));
    }

    function updateUI() {
        scoreSpan.textContent = game.score;
        timerSpan.textContent = Math.ceil(game.timeLeft);
        zombieSpan.textContent = game.zombies.length;
        ammoSpan.textContent = game.ammo;
        coinsSpan.textContent = game.coins;
        waveSpan.textContent = game.wave;
        weaponSpan.textContent = getWeaponLevel() + ' ств.' + (getWeaponLevel() > 1 ? ' (веер)' : '');
        if (!game.bossSpawned && game.wave % 5 !== 0) {
            bossIndicator.textContent = '-';
            bossIndicator.className = 'value';
        }
    }

    function endWave() {
        game.isActive = false;
        if (game.spawnInterval) clearInterval(game.spawnInterval);
        if (game.timerInterval) clearInterval(game.timerInterval);
        
        playWaveComplete();
        
        game.isShopOpen = true;
        shopDiv.style.display = 'block';
        earnedCoinsSpan.textContent = game.coins;
        killedCountSpan.textContent = game.kills;
        const bossText = game.bossDefeated ? ' 🎉 Босс повержен!' : (game.wave % 5 === 0 ? ' 😱 Босс выжил!' : '');
        document.getElementById('waveInfo').textContent = `Волна ${game.wave} завершена!${bossText}`;
        
        updateUI();
    }

    function startWave() {
        if (game.ammo <= 0) {
            alert('Нет патронов! Купите в магазине.');
            return;
        }
        
        game.isShopOpen = false;
        shopDiv.style.display = 'none';
        game.isActive = true;
        game.wave++;
        game.timeLeft = 15;
        game.bossSpawned = false;
        game.bossDefeated = false;
        game.maxZombies = Math.min(6 + game.wave * 2, 30);
        game.spawnRate = Math.max(18, 50 - game.wave * 2);
        game.zombies = [];
        game.bullets = [];
        
        // Обновляем оружие
        const weaponLevel = getWeaponLevel();
        weaponSpan.textContent = weaponLevel + ' ств.' + (weaponLevel > 1 ? ' (веер)' : '');
        
        updateUI();
        
        if (game.timerInterval) clearInterval(game.timerInterval);
        game.timerInterval = setInterval(() => {
            game.timeLeft--;
            timerSpan.textContent = Math.ceil(game.timeLeft);
            if (game.timeLeft <= 0) {
                endWave();
            }
        }, 1000);
        
        if (game.spawnInterval) clearInterval(game.spawnInterval);
        game.spawnInterval = setInterval(() => {
            if (game.isActive) spawnZombie();
        }, game.spawnRate);
    }

    // ======================================================================
    //  ОТРИСОВКА
    // ======================================================================
    function drawGame() {
        ctx.clearRect(0, 0, W, H);
        
        // Фон
        ctx.fillStyle = '#2a2a3a';
        ctx.fillRect(0, 0, W, H);
        
        // Трещины
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 20; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + (Math.random()-0.5)*60, y + (Math.random()-0.5)*60);
            ctx.stroke();
        }
        
        // Зона
        ctx.strokeStyle = 'rgba(255,0,0,0.05)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 20]);
        ctx.beginPath();
        ctx.arc(W/2, H/2, 150, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Пули
        for (const b of game.bullets) b.draw();
        
        // Зомби
        for (const z of game.zombies) z.draw();
        
        // Частицы
        for (const p of game.particles) p.draw();
        
        // Прицел
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        const cx = game.mouseX, cy = game.mouseY;
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy);
        ctx.lineTo(cx - 5, cy);
        ctx.moveTo(cx + 5, cy);
        ctx.lineTo(cx + 15, cy);
        ctx.moveTo(cx, cy - 15);
        ctx.lineTo(cx, cy - 5);
        ctx.moveTo(cx, cy + 5);
        ctx.lineTo(cx, cy + 15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 2, 0, Math.PI*2);
        ctx.fillStyle = 'red';
        ctx.fill();
        
        // Инфо об оружии на экране
        if (game.isActive) {
            const wl = getWeaponLevel();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`🔫 ${wl} ствола (веер)`, 10, 25);
        }
        
        if (!game.isActive && !game.isShopOpen) {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Нажмите "Начать волну"', W/2, H/2 - 20);
        }
        
        if (game.hitFlash > 0) {
            ctx.fillStyle = `rgba(255,200,100,${game.hitFlash/20})`;
            ctx.fillRect(0, 0, W, H);
            game.hitFlash--;
        }
    }

    // ======================================================================
    //  ИГРОВОЙ ЦИКЛ
    // ======================================================================
    function gameLoop() {
        if (game.isActive) {
            for (const z of game.zombies) z.update();
            
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const b = game.bullets[i];
                if (!b.update()) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                if (hitZombie(b)) {
                    game.bullets.splice(i, 1);
                }
            }
            
            for (let i = game.zombies.length - 1; i >= 0; i--) {
                const z = game.zombies[i];
                const dx = z.x - W/2;
                const dy = z.y - H/2;
                const dangerZone = z.isBoss ? 70 : 40;
                if (dx*dx + dy*dy < dangerZone * dangerZone) {
                    const penalty = z.isBoss ? 30 : 10;
                    game.score = Math.max(0, game.score - penalty);
                    game.coins = Math.max(0, game.coins - (z.isBoss ? 15 : 5));
                    const blood = new Particle(z.x, z.y, '#ff0000', z.isBoss ? 30 : 8, z.isBoss ? 6 : 3, z.isBoss);
                    game.particles.push(blood);
                    if (z.isBoss) {
                        game.bossSpawned = false;
                        bossIndicator.textContent = '💀 БОСС УШЁЛ!';
                        bossIndicator.className = 'value';
                    }
                    game.zombies.splice(i, 1);
                    updateUI();
                }
            }
        }
        
        for (let i = game.particles.length - 1; i >= 0; i--) {
            game.particles[i].update();
            if (!game.particles[i].alive) game.particles.splice(i, 1);
        }
        
        drawGame();
        requestAnimationFrame(gameLoop);
    }

    // ======================================================================
    //  УПРАВЛЕНИЕ
    // ======================================================================
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        game.mouseX = (e.clientX - rect.left) * scaleX;
        game.mouseY = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('click', (e) => {
        if (game.isActive) shoot();
        // Активируем аудио по клику (для iOS)
        if (!audioCtx) getAudioContext();
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        game.mouseX = (touch.clientX - rect.left) * scaleX;
        game.mouseY = (touch.clientY - rect.top) * scaleY;
        if (game.isActive) shoot();
        if (!audioCtx) getAudioContext();
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        game.mouseX = (touch.clientX - rect.left) * scaleX;
        game.mouseY = (touch.clientY - rect.top) * scaleY;
    });

    // ======================================================================
    //  МАГАЗИН
    // ======================================================================
    buyAmmoBtn.addEventListener('click', () => {
        const cost = 50;
        if (game.coins >= cost) {
            game.coins -= cost;
            game.ammo += 30;
            playBuy();
            updateUI();
            buyAmmoBtn.textContent = `🔫 Патроны (30шт) — 50 монет ✅`;
            setTimeout(() => {
                buyAmmoBtn.textContent = `🔫 Патроны (30шт) — 50 монет`;
            }, 1000);
        } else {
            buyAmmoBtn.textContent = `❌ Не хватает монет!`;
            setTimeout(() => {
                buyAmmoBtn.textContent = `🔫 Патроны (30шт) — 50 монет`;
            }, 1500);
        }
        if (!audioCtx) getAudioContext();
    });

    startWaveBtn.addEventListener('click', startWave);

    // ======================================================================
    //  ЗАПУСК
    // ======================================================================
    setTimeout(() => {
        game.isShopOpen = true;
        shopDiv.style.display = 'block';
        document.getElementById('waveInfo').textContent = 'Добро пожаловать в Зомбанадольск! 🧟';
        earnedCoinsSpan.textContent = '0';
        killedCountSpan.textContent = '0';
    }, 500);

    gameLoop();
    updateUI();

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && game.isActive) {
            // Игра продолжается
        }
    });

    console.log('🧟 Зомбанадольск ULTIMATE загружен!');
    console.log('🐌 Зомби очень медленные!');
    console.log('👑 Босс каждые 5 волн!');
    console.log('🔫 Оружие улучшается с каждой волной!');
    console.log('🎵 Звуки больше не пропадают!');
</script>
</body>
</html>
